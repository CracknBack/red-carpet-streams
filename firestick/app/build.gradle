plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
/* the version shown is the TV app's own version (read from the files copied into the app at build time) */
def infoFile = file('src/main/assets/www/appinfo.json')
def appVer = infoFile.exists() ? new groovy.json.JsonSlurper().parseText(infoFile.text).version : '0.0'

android {
    namespace 'com.tyre.redcarpetstreams'
    compileSdk 34

    /* BuildConfig.DEBUG gates the PLAYBACK_AUDIT.md Phase B measurement harness (diagnostics overlay,
       structured playback logging, device-capability dump) -- AGP 8+ no longer generates BuildConfig by
       default, so it has to be turned back on explicitly for that gate to exist at all. */
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.tyre.redcarpetstreams'
        minSdk 25
        targetSdk 34
        versionCode runNumber
        versionName "${appVer}"
    }

    /* The same signing key every build, so updates install over the top without losing your sign-in or favourites. */
    signingConfigs {
        release {
            storeFile file('rcs-release.p12')
            storePassword 'REDACTED-OLD-KEYSTORE-PASSWORD'
            keyAlias 'rcs'
            keyPassword 'REDACTED-OLD-KEYSTORE-PASSWORD'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        /* A separate package ID (com.tyre.redcarpetstreams.debug) so a debug build -- different
           signing key, since AGP auto-generates a debug keystore -- installs side by side with the
           release app instead of conflicting with it. Without this, `adb install` on a debug APK
           would fail outright, or force uninstalling the release app first and losing its sign-in
           and favourites (see the signing-key comment above). PLAYBACK_AUDIT.md Phase B harness
           only runs in this build type. */
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
}
