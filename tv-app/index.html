<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red Carpet Streams</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red2:#C41E2D;--red-deep:#7A101C;--focus-bg:linear-gradient(90deg,rgba(214,38,56,.82),rgba(168,26,42,.40));--bg:#0A111A;--panel:#0F1823;--raise:#16212E;--line:#443829;--text:#EEE7DB;--muted:#A39B8D;--amber:#E7B96F;--amber-soft:rgba(231,185,111,.18);--red:#E5483F;--yellow:#F2D13A}
html{font-size:0.8333vw;background:var(--bg)}
/* Windows: smaller type, more on screen */
html.pc{font-size:clamp(9px,0.6vw,13px)}
/* phone: bigger type relative to the screen, no remote hints, touch-friendly */
html.phone{font-size:clamp(8px,1.2vw,12px)}
html.phone .hints{display:none}
html.phone .page{bottom:0}
html.phone #rail{bottom:0}
html.phone .gmwrap,html.phone .mwrap{bottom:0}
html.phone #rail-logo,html.phone #clock{display:none}
html.phone #rail{padding-top:1rem}
html.phone .ri{padding:.9rem 1.2rem;margin:.1rem 1rem .1rem 0}
html.phone #page-browse.collapsed #preview{display:none!important}
html.phone #chips{flex-wrap:wrap;height:auto;row-gap:.8rem}
html.phone #qstat{display:none}
html.phone .gchips{row-gap:.8rem}
html.pc .row:hover,html.pc .card:hover .poster{cursor:pointer}
body{font-family:'Barlow','Helvetica Neue',Arial,sans-serif;color:var(--text);background:var(--bg);height:100vh;overflow:hidden;font-size:2rem;line-height:1.3;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.screen{position:fixed;top:0;left:0;right:0;bottom:0}
button,input{font:inherit;color:inherit}
.brand,h2,.n,.num,.key,.dial,.t,.times,.osd-clock,.bd,#clock,.k,.chip .c,.stitle,#numjump,.count{font-family:'Barlow Condensed','Arial Narrow',sans-serif}

/* login */
#login{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(8,13,20,.55),rgba(8,13,20,.8)),url(home-bg-wide.jpg) center/cover no-repeat,var(--bg)}
.login-box{display:grid;grid-template-columns:34rem 60rem;column-gap:8rem;align-items:center}
.login-box>*{grid-column:2}
#login .brand{font-weight:700;font-size:6rem;line-height:1}
.lede{color:var(--muted);margin:0 0 3.2rem}
.lmode{display:flex;gap:1.2rem;margin-bottom:2.4rem}
.lm{background:none;border:.2rem solid var(--line);border-radius:2.4rem;padding:.8rem 2.4rem;font-size:2rem;color:var(--muted);cursor:pointer}
.lm.on{color:var(--amber);border-color:rgba(231,185,111,.6)}
.lmode.focus .lm.on{background:rgba(160,28,42,.55);color:#fff;border-color:var(--amber)}
.field{display:block;margin-bottom:2.4rem}
.field span{display:block;color:var(--muted);font-size:1.7rem;margin-bottom:.6rem}
input{width:100%;background:var(--panel);border:.2rem solid var(--line);border-radius:.6rem;padding:1.2rem 1.6rem;font-size:2.4rem;outline:none}
.field.focus input,input:focus{border-color:var(--amber);box-shadow:0 0 0 .4rem var(--amber-soft)}
.btn{display:inline-block;background:var(--raise);border:.2rem solid var(--line);border-radius:.6rem;padding:1.2rem 3.2rem;font-size:2.2rem;font-weight:600;cursor:pointer}
.btn.focus{background:var(--red2);color:#fff;border-color:var(--amber)}
.err{color:#FF8A80;min-height:2.6rem;margin-top:2rem;font-size:1.8rem}

/* rail */
#main{--railw:23.5rem}
/* 8.6rem = 2.1rem padding + 4.4rem icon + 2.1rem padding (see #main.slim .ri below) -- chosen so the icon
   sits exactly centred with >=24px clear on each side, landing close to 100px wide at 1080p (~99px at
   this build's clamp(9px,0.6vw,13px) font-size). */
#main.slim{--railw:8.6rem}
#rail{position:absolute;left:0;top:0;bottom:5rem;width:var(--railw);overflow:hidden;display:flex;flex-direction:column;padding:3rem 0 2.4rem 2rem;background:linear-gradient(180deg,rgba(110,15,26,.35),rgba(10,17,26,0) 55%)}
#rail::after{content:'';position:absolute;top:0;bottom:0;right:0;width:.15rem;background:linear-gradient(180deg,rgba(231,185,111,.75),rgba(231,185,111,.08) 75%)}
/* Slim rail (icon-only): a thin, dim, flat divider instead of the glowing gradient above -- the
   gradient belongs to the full labelled rail, where it has room to breathe; here it was crowding the
   icons. */
#main.slim #rail::after{width:.08rem;background:rgba(231,185,111,.4)}
#series{background:linear-gradient(180deg,rgba(8,13,20,.86),rgba(8,13,20,.94)),url(home-bg-wide.jpg) center/cover no-repeat,var(--bg)}
#main{background:linear-gradient(180deg,rgba(8,13,20,.86),rgba(8,13,20,.94)),url(home-bg-wide.jpg) center/cover no-repeat,var(--bg)}
#rail .brand{font-size:2.4rem;line-height:1.05;font-weight:700;color:var(--amber);margin:0 0 3.2rem 2rem}
.ri{display:flex;align-items:center;gap:1.6rem;white-space:nowrap;padding:1.1rem 1.4rem 1.1rem 2.2rem;margin:.2rem 2rem .2rem 0;font-size:2.2rem;color:#B8A383;border-left:.4rem solid transparent;border-radius:0 .6rem .6rem 0;cursor:pointer}
.ri.active{color:#fff;border-left-color:var(--amber)}
.ri.focus{background:var(--focus-bg);color:#fff}
.ri .ic{width:4.4rem;height:4.4rem;flex:none;display:block}
.ri .ic svg,.ri .ic img{width:100%;height:100%;display:block;object-fit:contain}
.ri .ic img{opacity:.7;transition:opacity .15s}
.ri.active .ic img,.ri.focus .ic img{opacity:1;filter:drop-shadow(0 0 .7rem rgba(231,185,111,.5))}
#main.slim .ri .lbl{display:none}
/* Equal 2.1rem padding both sides of the icon (not the old 1.8rem/1.2rem split) is what actually
   centres it -- #main.slim #rail below drops its own left padding so this is the only padding in play,
   and --railw above is sized to match these two paddings + the icon exactly. The active-item bar moves
   to an absolutely-positioned ::before (border-left used to do this, but a real border adds to the box
   width unevenly and throws off the centring). */
#main.slim .ri{position:relative;margin:.2rem 0;padding:1.1rem 2.1rem;border-left:none}
#main.slim .ri::before{content:'';position:absolute;left:0;top:.5rem;bottom:.5rem;width:.35rem;border-radius:0 .2rem .2rem 0}
#main.slim .ri.active::before,#main.slim .ri.focus::before{background:var(--amber)}
#main.slim #rail-logo{width:4.8rem;margin:-1rem auto 2rem}
#main.slim #clock{font-size:1.45rem;padding-left:0;width:100%;text-align:center;white-space:nowrap}
#main.slim #rail{padding-left:0}
#clock{margin-top:auto;padding-left:2rem;font-size:2.6rem;color:var(--amber)}

/* pages */
.page{position:absolute;left:var(--railw);right:0;top:0;bottom:5rem;padding:2.4rem 4rem 0 3rem}
#page-browse{display:flex;gap:2.4rem}
#cats{width:23.4rem;flex:none;margin-top:5.8rem}   /* was 28rem -- narrowed so rows get more width for tiles */
#cats .row{gap:1rem}
#cats .bd{margin-left:0;flex:none}
.content{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
/* A hint that there's more below: rows can run well past one screen (now more than ever, with fewer,
   taller wide cards per row -- see ROW_TILES_TARGET), and #grid.rows's own scrollbar is the only other
   sign of that, easy to miss on a TV. A soft fade at the bottom edge reads as "this cuts off, scroll" at
   a glance; toggled on only for Movies/Series rows (renderBrowse), off for every other page. */
.rows-fade{position:absolute;left:0;right:0;bottom:0;height:7rem;pointer-events:none;background:linear-gradient(180deg,rgba(10,16,25,0),rgba(10,16,25,.92) 85%);z-index:2}
.head{position:relative;display:flex;align-items:center;gap:1.2rem;height:5rem;margin-bottom:.8rem;padding:0 .4rem}
.head::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.15rem;background:linear-gradient(90deg,var(--amber),rgba(160,28,42,.7) 25%,var(--line) 55%)}
h2{font-size:3rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head h2{font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:#E9CBA0}
.head .right{margin-left:auto;display:flex;align-items:center;gap:2.8rem;color:var(--muted);font-size:1.8rem;flex:none}
.list{flex:1;min-height:0;overflow:hidden}
.empty{padding:3rem 1.6rem;color:var(--muted);max-width:64rem}

/* "Categories" toggle (Movies/Series only): a discoverable alternative to pressing Left/Back for mouse
   users, since the sidebar collapses out of width for these pages when browsing items -- see
   #page-browse.rowsfocus below. D-pad Left/Back still does the same thing; this doesn't replace that. */
.catbtn{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.8rem;border-radius:999px;border:.15rem solid var(--line);background:var(--panel);color:var(--text);font-size:1.6rem;cursor:pointer}
.catbtn svg{width:1.8rem;height:1.8rem;flex:none}
.catbtn.focus,.catbtn:hover{border-color:var(--amber);color:var(--amber)}
#page-browse.rowsfocus #cats{display:none}

/* Hero: the currently-focused title, big -- driven by renderHero(), called whenever row/item focus
   changes. Backdrop reuses the poster image itself (blurred + darkened) rather than fetching a separate
   fanart image per focus change: this provider's category listings don't supply one, and it keeps this
   at zero extra network cost per keypress, same reasoning as everywhere else lean data gets reused
   instead of fetched. The synopsis only shows if already known (e.g. this title's detail page was
   opened earlier this session) -- deliberately never triggers its own fetch on focus, for the same
   reason: arrowing quickly through a row must never fire a burst of network requests. */
/* Confirmed on the real device tonight: this used to be 30rem + a 2.8rem margin, which on a 1080p TV
   screen left barely enough room below it for the first row before #grid's own overflow kicked in --
   on first load, before you've navigated into a row and triggered its own scroll-into-view, you just
   see whatever fits below the hero as-is, and that cut mid-poster with the caption entirely off-screen.
   Smaller hero, more guaranteed room for the row to actually show something readable right away. */
.hero{position:relative;border-radius:1.2rem;overflow:hidden;margin-bottom:1.8rem;min-height:19rem;display:flex;align-items:flex-end;background:var(--panel)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(.4rem) brightness(.5) saturate(1.15);transform:scale(1.08)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,13,20,.95) 0%,rgba(8,13,20,.8) 32%,rgba(8,13,20,.3) 62%,rgba(8,13,20,.1) 100%),linear-gradient(0deg,rgba(8,13,20,.92) 0%,rgba(8,13,20,0) 45%)}
.hero-info{position:relative;z-index:1;padding:3.2rem 3.6rem;max-width:62rem}
#hero-title{font-size:4.2rem;font-weight:800;line-height:1.08;margin:0 0 1.1rem;text-shadow:0 .3rem 1.2rem rgba(0,0,0,.65);text-wrap:balance}
.hero-meta{display:flex;align-items:center;gap:1.1rem;font-size:1.6rem;color:#fff;margin-bottom:1.3rem}
.hero-meta .bd{font-size:1.4rem;color:#fff;border-color:rgba(255,255,255,.4)}
.hero-plot{font-size:1.7rem;line-height:1.4;color:#EDE4D6;max-width:68ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 2.1rem}
.hero-plot:empty{display:none;margin:0}
.hero-actions{display:flex;gap:1.4rem}
.hero-play{display:flex;align-items:center;gap:.9rem;padding:1.2rem 2.8rem;border-radius:.6rem;border:.25rem solid transparent;background:#C41E2D;color:#fff;font-size:1.8rem;font-weight:700;cursor:pointer}
.hero-play svg{width:2rem;height:2rem;flex:none}
.hero-play.focus,.hero-play:hover{background:#E0354A;border-color:rgba(255,255,255,.4)}
.hero-versions{padding:1.2rem 2.8rem;border-radius:.6rem;border:.2rem solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);color:#fff;font-size:1.8rem;font-weight:600;cursor:pointer}
.hero-versions.focus,.hero-versions:hover{border-color:var(--amber);color:var(--amber)}
.hero-versions.hidden{display:none}

.row{height:6.8rem;display:flex;align-items:center;gap:1.6rem;padding:0 1.6rem;border-left:.4rem solid transparent;border-radius:0 .6rem .6rem 0;white-space:nowrap;cursor:pointer}
.row:hover{background:var(--panel)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.nowp{font-size:1.6rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.nowp b{color:var(--amber);font-weight:600;margin-right:.5rem}
.nowp b.nl{color:#fff;background:var(--red2);padding:0 .6rem;border-radius:.3rem;letter-spacing:.08em;font-size:1.4rem}
.nowp b.nr{color:var(--amber);border:.15rem solid var(--amber);padding:0 .5rem;border-radius:.3rem;letter-spacing:.08em;font-size:1.4rem}
.nowp:empty{display:none}
.sub.dim{opacity:.7}
.row .n{color:var(--muted);font-size:1.7rem;flex:none}
.row .num{width:6rem;flex:none;text-align:right;color:var(--muted)}
.row .logo{width:7rem;height:4rem;flex:none;object-fit:contain}
/* channel logo plates: every logo sits on the same light plate so mixed logos look uniform */
.lt{flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FAFBFC,#DFE5E9);border-radius:.6rem;overflow:hidden;padding:.35rem .6rem}
.lt img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lt.mono{background:linear-gradient(135deg,rgba(160,28,42,.38),rgba(110,15,26,.22));box-shadow:inset 0 0 0 .15rem rgba(231,185,111,.35);overflow:hidden}
.lt.mono b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;color:var(--amber);letter-spacing:.04em;white-space:nowrap;line-height:1}
.lt.row-l{width:9.4rem;height:5rem}
.lt.mono b{text-align:center}
.lt.row-l .l1,.lt.res-l .l1{font-size:1.6rem}.lt.row-l .l1.s,.lt.res-l .l1.s{font-size:1.3rem}.lt.pv-l .l1.s{font-size:1.6rem}.lt.osd-l .l1.s{font-size:2.4rem}.lt.row-l .l2,.lt.res-l .l2{font-size:1.2rem;line-height:1.1}
.lt.res-l{width:9rem;height:5.2rem}
.lt.pv-l{width:10rem;height:5.6rem}
.lt.pv-l .l1{font-size:2rem}.lt.pv-l .l2{font-size:1.45rem;line-height:1.1}
.lt.osd-l{width:17rem;height:9.6rem;padding:.8rem 1.2rem}
.lt.osd-l .l1{font-size:3rem}.lt.osd-l .l2{font-size:2.2rem;line-height:1.1}
.row.focus .lt{box-shadow:0 0 0 .22rem var(--amber)}
.pvhead{display:flex;align-items:center;gap:1.4rem}
.pvhead .pvname{flex:1;min-width:0}
.row.current{background:linear-gradient(90deg,rgba(196,34,52,.58),rgba(150,24,40,.24));border-left-color:var(--amber)}
.row.focus{background:var(--focus-bg);border-left-color:var(--amber);color:#fff}
.row.focus .num,.row.focus .n{color:var(--amber)}
.star{color:var(--amber);flex:none}
.bd{display:inline-block;font-size:1.4rem;font-weight:500;line-height:1;padding:.35rem .6rem .25rem;border:.15rem solid var(--line);border-radius:.4rem;color:var(--muted);margin-left:1rem;vertical-align:.25rem}
.bd.co{color:var(--amber);border-color:rgba(231,185,111,.5)}
.row.focus .bd{border-color:rgba(255,255,255,.35);color:#fff}
.dotkey{display:inline-block;width:1.4rem;height:1.4rem;border-radius:50%;margin-right:.8rem;vertical-align:-.1rem}
.dotkey.red{background:var(--red)} .dotkey.yellow{background:var(--yellow)}

/* poster grid */
#grid{display:grid;column-gap:1.6rem;grid-auto-rows:27rem;align-content:start;padding-left:.8rem}
#grid.rows{display:block;overflow-y:auto;overflow-x:hidden}   /* Movies/Series rows (see renderRows()) are plain stacked blocks, not grid cells -- the grid-template-columns gridCols() sets for the old flat grid would otherwise squeeze them into one narrow column. Three full rows don't fit one screen (same as Netflix) so this -- unlike the old grid, which was windowed to always fit exactly -- needs to actually scroll; renderRows() scrolls the focused row into view on every keypress. */
.card{cursor:pointer;min-width:0;padding-top:.4rem}
/* start screen */
#home{background:linear-gradient(180deg,rgba(8,13,20,.15),rgba(8,13,20,.55) 55%,rgba(8,13,20,.8)),url(home-bg-wide.jpg) center/cover no-repeat,var(--bg)}
#main.sport,#game{background:linear-gradient(180deg,rgba(8,13,20,.55),rgba(8,13,20,.78) 45%,rgba(8,13,20,.88)),url(sport-bg-wide.jpg) center/cover no-repeat,var(--bg)}
@media (orientation:portrait){#main.sport,#game{background:linear-gradient(180deg,rgba(8,13,20,.55),rgba(8,13,20,.78) 45%,rgba(8,13,20,.88)),url(sport-bg-portrait.jpg) center/cover no-repeat,var(--bg)}}
@media (orientation:portrait){#home{background:linear-gradient(180deg,rgba(8,13,20,.15),rgba(8,13,20,.55) 55%,rgba(8,13,20,.8)),url(home-bg-portrait.jpg) center/cover no-repeat,var(--bg)}}
.hwrap{position:absolute;top:0;left:0;right:0;bottom:5rem;padding:2.4rem 6rem 0;display:flex;flex-direction:column}
.hhead{position:relative;display:flex;justify-content:center;align-items:flex-start}
.hlogo{height:16.5rem;margin-top:2.2rem;width:auto;filter:drop-shadow(0 1rem 2.4rem rgba(0,0,0,.5))}
.hclock{position:absolute;right:0;top:.6rem;text-align:right}
.htime{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:7rem;font-weight:700;color:#fff;line-height:1}
.hdate{font-size:2.2rem;color:var(--text);margin-top:.6rem}
.hsub{font-size:1.7rem;color:var(--muted);margin-top:.4rem}
.htiles{display:grid;grid-template-columns:repeat(3,30rem);justify-content:center;gap:2.6rem 8rem;margin-top:4.2rem}
.htile{border-radius:2rem;background:none;border:.25rem solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:1rem 0 1.2rem;cursor:pointer;transition:transform .15s,filter .15s,background .15s;color:var(--text)}
.htile .hico{width:16rem;height:16rem;display:block;border-radius:50%;transition:box-shadow .15s,filter .15s}
.htile svg{width:7rem;height:7rem;color:var(--muted)}
.htile .hl{font-size:2.6rem;font-weight:700}
.htile .hd{font-size:1.6rem;color:var(--muted)}
.htile.focus{transform:scale(1.08)}
.htile.focus .hico{box-shadow:0 0 2.2rem .4rem rgba(160,28,42,.35);filter:brightness(1.2)}
.htile.focus .hl{color:var(--amber)}
.htile.focus svg{color:var(--amber)}
.htile.focus .hd{color:#F3D7A6}
.hstrip{margin-top:4.4rem}
.hcards{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem}
.hcard{background:var(--panel);border:.2rem solid var(--line);border-radius:1.2rem;padding:1.6rem 2rem;cursor:pointer;min-width:0}
.hcard .ht{font-size:2.2rem;font-weight:600;margin-top:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hs{font-size:1.6rem;color:var(--muted);margin-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .sbar{margin-top:1rem}
.hcard.focus{border-color:var(--amber);background:var(--focus-bg)}
.hver{position:absolute;right:6rem;bottom:1.4rem;font-size:1.5rem;color:var(--muted)}
/* the carousel: the chosen tile large in the middle, the others shrinking and fading away on each side */
.hcar{display:flex;justify-content:center;align-items:center;gap:2rem;flex:1 1 auto;min-height:0;margin-top:.4rem;perspective:120rem}
.hslot{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:2.4rem;color:#E9CBA0;text-align:center;
  background:linear-gradient(180deg,rgba(20,29,42,.94),rgba(10,16,25,.97));border:.3rem solid #B98B55;
  box-shadow:inset 0 0 0 .5rem #0B121B,inset 0 0 0 .62rem rgba(150,20,36,.85),0 1rem 3rem rgba(0,0,0,.45);transition:transform .18s,opacity .18s}
.hslot .hg{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:2rem 2rem 0}
.hslot .hg img{max-width:50%;max-height:72%;object-fit:contain}
.hslot .hl{text-transform:uppercase;letter-spacing:.06em;font-weight:300;margin-bottom:2rem}
.hslot .hd{text-transform:uppercase;letter-spacing:.08em;font-size:2rem;margin:-1rem 0 2.2rem;color:#D9B98F}
.hslot.s0{width:26rem;height:37rem;border-color:#E6B86F}
.hslot.s0 .hl{font-size:3.5rem;margin-bottom:1.4rem}
.hslot.s0.focus{border-color:#F4C97E;box-shadow:inset 0 0 0 .5rem #0B121B,inset 0 0 0 .62rem rgba(170,24,40,.95),0 0 3rem rgba(231,185,111,.28),0 0 1rem rgba(231,185,111,.22)}
.hslot.s1{width:20rem;height:25.5rem}.hslot.s1 .hl{font-size:2.3rem}
.hslot.s2{width:17rem;height:21.5rem;opacity:.85}.hslot.s2 .hl{font-size:2rem}
.hslot.s3{width:14.5rem;height:18.5rem;opacity:.42}.hslot.s3 .hl{font-size:1.75rem}
.hslot.ghost{visibility:hidden}
.hslot.s1.L{transform:rotateY(10deg)}.hslot.s1.R{transform:rotateY(-10deg)}
.hslot.s2.L{transform:rotateY(17deg)}.hslot.s2.R{transform:rotateY(-17deg)}
.hslot.s3.L{transform:rotateY(24deg)}.hslot.s3.R{transform:rotateY(-24deg)}
/* the live sports banner */
.hstrip{margin-top:1rem;margin-bottom:.4rem}
.hstrip .slabel{font-size:2.6rem;letter-spacing:.1em;color:#E9CBA0;text-transform:uppercase;font-weight:300;margin-bottom:.8rem}
/* one unified box: a wide hero game card on top, the full sport-icon row along the bottom -- used to be
   two separate bordered boxes side by side (a narrower "live sports" card plus a "Browse" chip column),
   merged into one so it reads as a single Sports Hub rather than two unrelated panels. */
/* a contained banner the size/ratio of the owner's reference picture (roughly 4:1), not a full-bleed
   strip across the whole screen -- it used to stretch edge to edge like the carousel above it, which
   read as far too heavy under that carousel. Centred, not pinned to the carousel's own left edge, since
   it's a distinct smaller element now, not a continuation of the same row. */
.hhub{position:relative;display:flex;flex-direction:column;width:78rem;max-width:100%;margin:0 auto;border-radius:2rem;border:.3rem solid #B98B55;background:linear-gradient(90deg,rgba(18,26,38,.95),rgba(10,16,25,.97));overflow:hidden;box-shadow:0 1rem 3rem rgba(0,0,0,.4);transition:border-color .15s,box-shadow .15s}
/* the box's own outer glow, for the 'brand' zone -- landing on the Sports Hub section highlights the
   whole box (this), not just the one featured game; .hb-game.focus below is the narrower, separate
   glow for once you've actually stepped inward onto the card itself. */
.hhub.focus{border-color:#F4C97E;box-shadow:0 0 0 .3rem rgba(231,185,111,.4),0 0 3.5rem rgba(231,185,111,.3),0 1rem 3rem rgba(0,0,0,.4)}
.hhub-game{display:flex;align-items:stretch;height:19.5rem;flex:none}
.hhub-game .hb-game{flex:1}
/* the brand + Live/Replay/Upcoming tabs sit pinned over the top of the hero photo now (not a separate
   header bar above the box) -- out of flow so it never pushes the bottom-anchored game text down. */
.hhub-head{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:flex-start;gap:2rem;padding:1.7rem 2.6rem 0}
/* a <button> now (was a plain div) -- lets you jump straight into the full Sports Hub browse page
   (every sport, no single game picked) separately from pressing the hero card itself, which always
   opens whichever one game is currently featured. Needs the usual native-button reset since nothing
   about how it looks should change just because the tag did. */
.hhub-brand{appearance:none;background:none;border:none;padding:0;margin:0;font:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:1.1rem;min-width:0;border-radius:.6rem}
.hhub-brand.focus{box-shadow:0 0 0 .2rem var(--amber);outline:none}
.hhub-sh{width:5.4rem;height:5.4rem;flex:none;filter:drop-shadow(0 .2rem .5rem rgba(0,0,0,.65))}
.hhub-title{font-size:3.4rem;letter-spacing:.1em;color:#E9CBA0;text-transform:uppercase;font-weight:700;text-shadow:0 .2rem .8rem rgba(0,0,0,.9);white-space:nowrap}
/* the sport-icon row stays in the DOM (so its own focus/scroll state survives) but collapses to zero
   height behind the toggle tab -- the hero/game card above gets that space back until you ask for it. */
.hsport-toggle-row{display:flex;justify-content:center;flex:none}
.hsport-toggle{appearance:none;background:rgba(0,0,0,.25);border:.15rem solid rgba(231,185,111,.4);border-bottom:none;border-radius:.8rem .8rem 0 0;padding:.5rem 2.2rem .4rem;margin-top:-.15rem;color:#E9CBA0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;gap:.6rem}
.hsport-toggle.focus{outline:.2rem solid var(--amber);outline-offset:-.3rem}
.hst-car{display:inline-block;transition:transform .25s ease;font-size:1.1rem}
.hhub.sports-open .hst-car{transform:rotate(180deg)}
/* a fixed centre slot, same idea as .hcar/.hslot above -- HOME.sportCard stays put on screen (dead
   centre of this row) and the icons slide through it instead of the row auto-scrolling to catch up with
   focus. Only ever needs room for a handful of icons (see renderHome's windowed dd loop), so unlike the
   old auto-scroll strip it never has to fight the hero card above it for height ("the sports icons
   squish everything up") -- .hhub-game has no sports-open override anymore. */
.hhub-sports{display:flex;align-items:center;justify-content:center;gap:1.6rem;max-height:0;padding:0 2.6rem;overflow:hidden;border-top:0 solid rgba(231,185,111,.22);transition:max-height .28s ease,padding .28s ease}
.hhub.sports-open .hhub-sports{max-height:10.5rem;padding:1.6rem 2.6rem 1.8rem;border-top-width:.15rem}
.hhub-sports .spslot{flex:none;display:flex;flex-direction:column;align-items:center;gap:.5rem;cursor:pointer;color:#E9CBA0;text-align:center;transition:transform .2s ease,opacity .2s ease}
.hhub-sports .spslot.c0{transform:scale(1.25)}
.hhub-sports .spslot.c0.focus{color:#fff}
.hhub-sports .spslot.c0.focus .hb-logo img{filter:drop-shadow(0 0 .7rem rgba(231,185,111,.75))}
.hhub-sports .spslot.c1{opacity:.6}
.hhub-sports .spslot.c2{opacity:.32}
.hhub-sports .spslot.c3{opacity:.12}
.hhub-sports .hb-logo{width:4.4rem;height:4.4rem}
.hhub-sports .hb-cl{font-size:1.2rem;max-width:8.5rem;white-space:normal;text-align:center;line-height:1.15}
.hb-game{position:relative;flex:2.5;min-width:0;padding:1.4rem 2.4rem;display:flex;flex-direction:column;justify-content:center;gap:.6rem;cursor:pointer;
  justify-content:flex-end;background:linear-gradient(90deg,rgba(8,13,20,.86) 0,rgba(8,13,20,.62) 38%,rgba(8,13,20,.12) 62%,rgba(8,13,20,0) 78%),url(hero-banner.jpg) 85% 40%/cover no-repeat}
.hb-game .hb-title,.hb-game .hb-sub{text-shadow:0 .2rem 1rem rgba(0,0,0,.9)}
.hb-game.idle{cursor:default}
.hb-building{text-shadow:0 .2rem 1rem rgba(0,0,0,.9);font-size:1.6rem;color:#E9CBA0}
.hb-pill{align-self:flex-start;font-weight:800;letter-spacing:.08em;font-size:1.5rem;padding:.2rem 1.3rem;border-radius:.6rem;background:#C41E2D;color:#fff}
.hb-pill.next{background:none;border:.15rem solid #E9CBA0;color:#E9CBA0}
.hb-title{text-shadow:0 .2rem 1rem rgba(0,0,0,.8);font-size:3.2rem;font-weight:800;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-title.long{font-size:2.7rem}
.hb-vs{color:#E9B96E}
.hb-sub{text-shadow:0 .2rem .8rem rgba(0,0,0,.8);font-size:1.5rem;color:#E9CBA0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-find{display:flex;align-items:center;padding:0 2.4rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:4.8rem;font-weight:700;color:#E9B96E;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.hb-chips{display:flex;align-items:center;gap:1.6rem;padding:0 2.4rem 0 .6rem}
.hb-chip{display:flex;flex-direction:column;align-items:center;gap:.6rem;cursor:pointer}
.hb-badge{width:8.6rem;height:8.6rem;border-radius:50%;border:.3rem solid #B98B55;background:radial-gradient(circle at 35% 30%,#6b1220,#3a0b14);display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:700;color:#E9CBA0;letter-spacing:.03em}
.hb-cl{font-size:1.45rem;color:#E9CBA0;max-width:14rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-game.focus{box-shadow:inset 0 0 0 .4rem var(--amber)}
.hb-find.focus{color:#fff;text-shadow:0 0 2rem rgba(231,185,111,.7)}
.hb-chip.focus .hb-badge{border-color:var(--amber);box-shadow:0 0 1.1rem rgba(231,185,111,.4)}
html.phone .hslot.s2,html.phone .hslot.s3{display:none}
html.phone .hb-chips{display:none}
html.phone .hb-find{font-size:3.4rem;padding:0 2rem}
/* landing banner: only games that are live now, cycling; no placeholder text */
.hb-top{display:flex;align-items:center;gap:1.4rem}
.hb-count{font-size:1.8rem;color:#E9CBA0;letter-spacing:.08em}
.hb-game.fade .hb-top,.hb-game.fade .hb-title,.hb-game.fade .hb-sub{animation:hbfade .6s ease}
@keyframes hbfade{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
.hb-logo{width:9.6rem;height:9.6rem;display:flex;align-items:center;justify-content:center}
.hb-lg{max-width:100%;max-height:100%;object-fit:contain}
.hb-chip.focus .hb-logo{filter:drop-shadow(0 0 1.4rem rgba(231,185,111,.7))}
/* the fixtures: tiles, three across */
#rlist.fgridwrap{overflow-y:auto;overflow-x:hidden;padding:1.4rem 2.6rem 4rem 2.6rem;scrollbar-width:none}
#rlist.fgridwrap::-webkit-scrollbar,#g-chans.ctiles::-webkit-scrollbar{display:none}
.fhead,.chead{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:1.8rem;color:var(--amber);margin:2.2rem 0 1rem;display:flex;align-items:baseline;gap:1.2rem}
.fhead:first-child,.chead:first-child{margin-top:.6rem}
.chead span{font-family:'Barlow',sans-serif;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:1.6rem}
.chip .tabi{height:2.8rem;width:auto;vertical-align:middle;margin-right:.9rem}
.fsec{display:grid;grid-template-columns:repeat(2,1fr);gap:1.8rem}
.ftile,.ctile{position:relative;min-width:0;border-radius:1.8rem;cursor:pointer;background:linear-gradient(180deg,rgba(20,29,42,.94),rgba(10,16,25,.97));border:.25rem solid #8A6A45;
  box-shadow:inset 0 0 0 .4rem #0B121B,inset 0 0 0 .5rem rgba(150,20,36,.8);transition:transform .12s}
.ftile.focus,.ctile.focus{border-color:#F4C97E;box-shadow:inset 0 0 0 .4rem #0B121B,inset 0 0 0 .5rem rgba(170,24,40,.95),0 0 2rem rgba(231,185,111,.28);transform:scale(1.03);z-index:2}
.ftile{min-height:16.5rem;padding:1.4rem 2.2rem;display:flex;flex-direction:column;justify-content:space-between;gap:1rem}
.ft-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:2.8rem}
.ft-comp{display:flex;align-items:center;gap:1rem;font-size:1.5rem;color:#B8A383;letter-spacing:.06em;text-transform:uppercase;min-width:0;white-space:nowrap;overflow:hidden}
.ft-comp img{height:2.8rem;width:auto}
.ft-pill{font-weight:800;letter-spacing:.1em;font-size:1.5rem;padding:.1rem .9rem;border-radius:.5rem;white-space:nowrap}
.ft-pill.live{background:#C41E2D;color:#fff}
.ft-pill.on{border:.15rem solid var(--amber);color:var(--amber)}
.ft-pill.rep{border:.15rem solid #B8A383;color:#B8A383}
.ft-names{font-size:3rem;font-weight:600;color:#fff;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem}
.ft-time{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:4.2rem;font-weight:700;color:var(--amber);line-height:1}
.ft-n{font-size:1.5rem;color:var(--muted)}
/* a game's channels: tiles, four across, in three groups */
#game #g-chans{max-width:none}
#g-chans.ctiles{overflow-y:auto;overflow-x:hidden;padding:1.4rem 2.6rem 4rem 2.6rem;scrollbar-width:none}
.csec{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem}
.ctile{min-height:14.4rem;padding:1.4rem 1.6rem;display:flex;align-items:center;gap:1.6rem}
.ctile.unsure{opacity:.85}
.ct-logo{flex:none;width:12.8rem;display:flex;align-items:center;justify-content:center}
.ct-logo .lt{width:12.4rem;height:7.4rem}
.lt.ct-l .l1{font-size:1.7rem}.lt.ct-l .l1.s{font-size:1.4rem}.lt.ct-l .l2{font-size:1.3rem;line-height:1.1}
#game #gm-count{display:none}
.ct-info{min-width:0;flex:1}
.ct-name{font-size:2.3rem;font-weight:600;color:#fff;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct-sub{font-size:1.65rem;color:#E9CBA0;margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct-sub .cd{display:block}
.ct-tags:empty{display:none}
.ct-tags{margin-top:.6rem;display:flex;gap:1rem;overflow:hidden;white-space:nowrap}
.ct-ok{font-size:1.45rem;color:#9AD3A6}.ct-lk{font-size:1.45rem;color:var(--muted)}.ct-app{font-size:1.45rem;color:#E9B96E}
.ct-warn{font-size:1.4rem;color:#FF8A80;margin-top:.4rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cempty{padding:3rem 1rem;color:var(--muted);font-size:2.2rem}
html.phone .fsec{grid-template-columns:1fr}
html.phone .csec{grid-template-columns:repeat(2,1fr)}

html.phone .htiles{grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:2rem}
html.phone .htile .hico{width:9rem;height:9rem}
html.phone .htiles{grid-template-columns:repeat(3,1fr);gap:1.2rem}
html.phone .hlogo{height:8rem}
html.phone .hwrap{bottom:0;padding:2rem 3rem 0}
/* find a game */
#page-games{display:flex;flex-direction:column}
.gchips{display:flex;gap:1.2rem;flex-wrap:wrap;margin:1.2rem 0 1.4rem;flex:none}
.gbody{flex:1;min-height:0;display:flex;gap:2.4rem}
#g-list{flex:1;min-width:0}
.gside{width:46rem;flex:none;display:flex;flex-direction:column;min-height:0}
.gside .slabel{margin-top:0}
#g-chans{flex:1;min-height:0}
.row.gev{height:8.2rem;gap:2rem}
.gwhen{width:11rem;flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.gon{border:.2rem solid var(--muted);color:var(--text);font-weight:700;letter-spacing:.1em;font-size:1.5rem;padding:.05rem .7rem;border-radius:.4rem}
.grp{border:.2rem solid var(--amber);color:var(--amber);font-weight:700;letter-spacing:.1em;font-size:1.5rem;padding:.05rem .7rem;border-radius:.4rem}
.gl{background:var(--red2);color:#fff;font-weight:700;letter-spacing:.12em;font-size:1.6rem;padding:.15rem .8rem;border-radius:.4rem}
.gt{color:var(--amber);font-size:2.2rem;font-weight:700}
.gp{color:var(--muted);font-size:1.7rem;letter-spacing:.06em;text-transform:uppercase}
.gs{color:var(--muted);font-size:1.6rem}
.gtxt{flex:1;min-width:0}
.gtitle{font-size:2.3rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.gev .sbar{max-width:40rem;margin-top:.6rem}
.row.gch{height:8.6rem}
.row.gch.doubt .gtitle{color:var(--muted)}
.sub.warnline{color:#FFB4A8}
.row.gch .gtitle{font-size:2rem}
.askbox{min-width:70rem}
.askbox input{margin:1.2rem 0 1.6rem}
#ask-msg{white-space:pre-wrap;max-height:60vh;overflow:auto;font-size:1.7rem;line-height:1.45}
/* favourites tiles */
#tiles{display:grid;column-gap:1.6rem;grid-auto-rows:27rem;align-content:start;padding:.4rem .8rem 0}
.tile{cursor:pointer;min-width:0}
.tmedia{position:relative;height:15.75rem;border-radius:.8rem;background:radial-gradient(ellipse at 50% 35%,#1E3B49,#0E1C24 75%);border:.25rem solid rgba(35,65,79,.8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile.focus .tmedia{border-color:var(--amber);box-shadow:0 1.2rem 3rem rgba(160,28,42,.45)}
.lt.tile-l{width:17rem;height:9.6rem;padding:1rem 1.4rem}
.lt.tile-l .l1{font-size:3rem}.lt.tile-l .l1.s{font-size:2.4rem}.lt.tile-l .l2{font-size:2.2rem;line-height:1.1}
.tnum{position:absolute;top:.8rem;left:.8rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.8rem;color:var(--amber);background:rgba(10,17,26,.85);padding:.1rem .7rem;border-radius:.4rem;z-index:1}
.tlive{position:absolute;top:.8rem;right:.8rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:.12em;color:#fff;background:var(--red2);padding:.2rem .8rem;border-radius:.4rem;z-index:1}
.tcap{padding:1rem .2rem 0}
.tname{font-size:2.2rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.focus .tname{color:#fff}
.tnow{font-size:1.75rem;margin-top:.3rem}
.tnow .r{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnow .lbl{font-family:'Barlow Condensed','Arial Narrow',sans-serif;color:var(--amber);font-weight:700;letter-spacing:.08em;margin-right:.8rem}
.tnow .nx{color:var(--muted);font-size:1.6rem}
.tnow .sbar{margin:.5rem 0 .45rem}
#page-browse.tiles.tcoll #cats{display:none}
#page-browse.tiles #preview{display:block!important;width:0;padding:0;flex:none}
#page-browse.tiles #pvinfo{display:none}
#page-browse.tiles .pvbox{position:fixed;z-index:3;background:transparent;border:0;border-radius:.6rem;pointer-events:none}
#page-browse.tiles .pvmsg{font-size:1.5rem;align-items:flex-end;padding:1rem}
.poster{position:relative;width:15rem;height:22.5rem;border-radius:.8rem;overflow:hidden;background:var(--panel);border:.25rem solid transparent}
.poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;left:1rem;right:1rem;bottom:1rem;font-size:1.7rem;line-height:1.25;color:var(--muted);max-height:11rem;overflow:hidden}
.pfav{position:absolute;top:.5rem;right:.8rem;color:var(--amber);font-size:2.4rem;text-shadow:0 0 .6rem #000}
.pp{position:absolute;left:0;bottom:0;height:.6rem;background:var(--amber)}
.card.focus .poster{border-color:var(--amber);box-shadow:0 1rem 2.4rem rgba(160,28,42,.45),0 0 1.6rem rgba(231,185,111,.35);transform:scale(1.08);transition:transform .12s}
/* Wide cards (row-track): the poster sits right next to the info panel now, not above a caption with
   room to spare -- scaling it up on focus (the flat-grid behaviour above) overlaps that panel's text
   instead of leaving it be, since a transform never reflows neighbours. The border+glow alone already
   reads as focus clearly enough here. */
.row-track .card.focus .poster{transform:none}
.card.current .poster{border-color:var(--line)}
/* Fixed card width: this is load-bearing, not cosmetic -- without it the caption's own text decides the
   flex item's width (a block with white-space:nowrap has no overflow to truncate against until something
   constrains it), so cards end up different widths depending on how long their title is. That in turn
   breaks every row-track position calculation downstream (uneven gaps, a card sliver left visible at the
   row's edge, dead space at the end) -- confirmed by measuring real rendered card widths varying by over
   12px with the old unconstrained rule. .row-track overrides this with a measured, screen-width-aware
   value (--cw, set in renderRows()) so "6 tiles + a peek" holds at any resolution; plain width:15rem is
   just the fallback for the older flat grid (Favourites/Continue watching), which never needed to change. */
.card{width:15rem}
/* Wide cards (Movies/Series rows only): poster keeps its own natural portrait shape at --pw (a fraction
   of the card), the title/rating/quality/version count sit beside it in their own panel -- same fields
   as before (cardHtml's `meta`), just laid out next to the art instead of squeezed into a caption under
   a narrow thumbnail. The plain .poster/.ct/.cm rules above stay the flat-grid fallback (Favourites/
   Continue watching), untouched. */
.row-track .card{display:flex;align-items:stretch;gap:1.4rem;width:var(--cw,38rem);flex:none}
.row-track .poster{width:var(--pw,13rem);height:calc(var(--pw,13rem) * 1.5);flex:none}
.row-track .cinfo{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.row-track .ct{margin-top:0;font-size:2.1rem;font-weight:600;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row-track .cm{flex-wrap:wrap;row-gap:.5rem;margin-top:.9rem}
.row-track .cm span{border:.13rem solid rgba(184,163,131,.4);border-radius:.4rem;padding:.15rem .7rem;white-space:nowrap}
.ct{margin-top:.7rem;font-size:1.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.focus .ct{color:#fff}
.cm{display:flex;gap:1.2rem;font-size:1.5rem;color:var(--muted);white-space:nowrap;overflow:hidden}

/* Netflix-style rows for Movies/Series: three fixed, differently-sorted horizontally-scrolling rows
   instead of one dense grid -- see catRows()/renderRows() in the script. Reuses .card/.poster above
   (just bigger, see those rules) so there is one card look everywhere, not a second style to maintain. */
.rows-wrap{display:flex;flex-direction:column;gap:3.2rem;overflow:hidden;padding-bottom:2rem}
.row-sec{min-width:0;overflow:hidden;scroll-margin-top:1rem}
.row-head{margin:0 0 1.2rem .2rem;font-size:2rem;font-weight:600;color:#B8A383;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sec.focus .row-head{color:var(--amber)}
.row-track{display:flex;gap:var(--rg,1.6rem);overflow:hidden}
.srchrow{display:flex;align-items:center;gap:1.2rem;height:5.6rem;padding:0 2.2rem;margin-bottom:2rem;border-radius:.8rem;background:var(--panel);border:.2rem solid var(--line);color:var(--muted);font-size:1.9rem;cursor:pointer;width:fit-content}
.srchrow svg{width:2.3rem;height:2.3rem;flex:none}
.srchrow.focus{border-color:var(--amber);color:#fff;box-shadow:0 0 1.6rem rgba(231,185,111,.35)}

/* search */
#page-search{display:grid;grid-template-columns:35.4rem 1fr;grid-template-rows:7rem 1fr;column-gap:3rem;row-gap:2rem}
#page-search.nokb{grid-template-columns:0 1fr;column-gap:0}
#page-search.nokb #kb{display:none}
.qbox{grid-column:1 / 3;display:flex;align-items:center;gap:2.4rem}
.qbar{flex:1;height:7rem;display:flex;align-items:center;gap:1.4rem;padding:0 1.2rem 0 2.2rem;background:var(--panel);border:.2rem solid var(--line);border-radius:3.5rem}
.qbar.hot{border-color:var(--amber);box-shadow:0 0 0 .4rem rgba(231,185,111,.12)}
.qic{width:3rem;height:3rem;color:var(--muted);flex:none}
.qbar.hot .qic{color:var(--amber)}
#q,#q:focus{flex:1;height:100%;font-size:2.8rem;padding:0;border:0!important;box-shadow:none!important;background:none;cursor:default;outline:none;min-width:0}
.qclear{flex:none;background:var(--raise);border:.2rem solid transparent;color:var(--text);font-size:1.7rem;padding:.7rem 1.6rem;border-radius:2.4rem;cursor:pointer}
.qclear.focus{border-color:var(--amber);background:rgba(160,28,42,.55);color:#fff}
#qstat{color:var(--muted);font-size:1.6rem;white-space:nowrap;max-width:30rem;overflow:hidden;text-overflow:ellipsis;text-align:right}
#kb{display:grid;grid-template-columns:repeat(6,5.4rem);grid-auto-rows:5.4rem;gap:.6rem;align-content:start}
.k{background:var(--panel);border:.2rem solid transparent;border-radius:.6rem;font-size:2.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.k.wide{font-family:'Barlow',sans-serif;font-size:1.7rem}
.k.focus{background:var(--red2);color:#fff;border-color:var(--amber)}
.sres{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-width:0;min-height:0}
#kb{grid-column:1;grid-row:2}
#chips{display:flex;gap:1.2rem;height:5rem;align-items:center;margin-bottom:.8rem;flex:none}
.chip{padding:.7rem 1.4rem;border:0;border-radius:.6rem;background:none;font-size:2rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -.3rem 0 transparent}
.chip .c{margin-left:.6rem;font-size:1.5rem;font-weight:500;opacity:.75}
.chip.on{color:#fff;box-shadow:inset 0 -.3rem 0 var(--amber)}
.chip .cx{margin-left:1rem;font-size:1.5rem;opacity:.85;padding:0 .3rem;border-radius:.3rem}
.chip .cx:hover{color:#FFB4A8;opacity:1}
.chip.focus{background:rgba(160,28,42,.55);color:#fff}
#chips{border-bottom:.15rem solid var(--line)}
.row.r{height:8.4rem}
.row.hdr{cursor:default;align-items:flex-end;padding-bottom:.6rem}
.row.hdr:hover{background:none}
.row.hdr .slabel{margin:0}
.row.gres .rwhen{width:13.5rem;flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif}
/* game page */
.gmwrap{position:absolute;top:0;left:0;right:0;bottom:5rem;padding:5rem 8rem 0;display:flex;flex-direction:column}
.gmwhen{display:flex;align-items:center;gap:1.4rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin-bottom:.6rem}
.gmwhen .gs{font-size:2rem}
.gmsearch{position:absolute;top:5.4rem;right:8rem;background:rgba(19,38,49,.85);border:.2rem solid var(--line);color:var(--text);font-size:1.9rem;padding:1rem 2.2rem;border-radius:3rem;cursor:pointer}
.gmsearch:hover{border-color:var(--amber)}
.gmlk{font-size:1.65rem;color:var(--muted);max-width:118rem;margin:.2rem 0 1rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gmlk:empty{display:none}
.gmbar{max-width:70rem;margin:.4rem 0 1.6rem}
#game #g-chans{flex:1;min-height:0;max-width:none}
.th{width:8rem;height:4.8rem;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:.4rem;overflow:hidden}
.th img{max-width:100%;max-height:100%;object-fit:contain}
.th img.pos{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rt .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:1.5rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:none;color:var(--amber);font-weight:600}
.row.focus mark{color:var(--amber)}

/* settings */
#page-settings{padding-top:4rem}
.sgrid{display:flex;gap:4rem;height:100%;min-height:0}
.sacct{width:46rem;flex:none}
.sacct .kv{display:flex;justify-content:space-between;gap:2rem;padding:.9rem 0;border-bottom:.15rem solid var(--line);font-size:1.8rem}
.sacct .kv span:first-child{color:var(--muted)}
.sacct .kv span:last-child{text-align:right;overflow:hidden;text-overflow:ellipsis}
.sacct .note{margin-top:2rem}
.slist{flex:1;min-width:0;overflow-y:auto;padding:0 1rem 4rem 0;scrollbar-width:none}
.slist::-webkit-scrollbar{display:none}
.slist .slabel{margin:2.4rem 0 .8rem}
.slist .slabel:first-child{margin-top:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:2rem;min-height:6.4rem;padding:0 2.2rem;border-radius:.8rem;font-size:2.1rem;cursor:pointer;border-left:.4rem solid transparent}
.srow .v{color:var(--muted);font-size:1.8rem;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.srow.focus{background:var(--focus-bg);border-left-color:var(--amber)}
.srow.focus .v{color:var(--amber)}
.srow.danger{color:#FFB4A8}
.acct{display:table;margin-bottom:4rem}
.acct div{display:table-row}
.acct span{display:table-cell;padding:.8rem 4rem .8rem 0}
.acct span:first-child{color:var(--muted)}
.sbtn{display:block;width:46rem;text-align:left;margin-bottom:1.2rem}
.note{color:var(--muted);font-size:1.7rem;max-width:70rem;margin-top:2.4rem}

.hints.idle{opacity:0}
.hints{transition:opacity .6s;position:absolute;bottom:0;left:0;right:0;height:5rem;display:flex;align-items:center;gap:3.2rem;padding:0 4rem;color:var(--muted);font-size:1.8rem;background:var(--bg)}
.hints::before{content:'';position:absolute;top:0;left:0;right:0;height:.15rem;background:linear-gradient(90deg,rgba(231,185,111,.7),rgba(160,28,42,.6) 30%,rgba(35,65,79,.8) 70%)}
.key{color:var(--text);border:.15rem solid var(--line);border-radius:.4rem;padding:0 .7rem;margin-right:.8rem;font-weight:500}

/* series */
#series{display:grid;grid-template-columns:24rem 1fr;gap:4rem;padding:5rem 6rem 7rem}
.scover{width:24rem;height:36rem;border-radius:.8rem;background:var(--panel) center/cover no-repeat}
.sinfo{display:flex;flex-direction:column;min-height:0;min-width:0}
.stitle{font-size:5rem;font-weight:700;line-height:1.05}
.smeta{display:flex;gap:2.4rem;color:var(--muted);font-size:1.9rem;margin:.8rem 0 1.2rem}
.splot{color:var(--muted);font-size:1.9rem;max-width:92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2.4rem}
#seasons{display:flex;gap:1.2rem;overflow:hidden;min-height:5rem;margin-bottom:1.2rem;flex:none}
.row.ep{height:6.8rem;position:relative}
.epp{position:absolute;left:9.6rem;right:1.6rem;bottom:.5rem;height:.4rem;background:var(--line)}
.epp i{display:block;height:100%;background:var(--amber)}

/* player */
#player{background:#000}
#video{width:100%;height:100%;object-fit:contain;background:#000}
.osd{position:absolute;left:4rem;right:4rem;bottom:4rem;display:flex;align-items:center;gap:3.2rem;padding:2.4rem 3.2rem;background:rgba(10,17,26,.9);border:.1rem solid var(--line);border-radius:1rem;border-top:.3rem solid var(--red2)}
.dial{font-weight:700;font-size:8.5rem;line-height:1;color:var(--amber);text-shadow:0 0 2.4rem rgba(231,185,111,.45);min-width:14rem;text-align:right}
.info{flex:1;min-width:0}
.title{font-size:3.4rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epg{margin-top:.8rem}
.prog{display:flex;gap:1.6rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.prog.now{color:var(--text)}
.t{width:9rem;flex:none}
.osd-clock{font-size:2.8rem;color:var(--muted);align-self:flex-start}
.bar{height:.7rem;background:var(--line);border-radius:.35rem;margin:1.6rem 0 .8rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
.times{display:flex;justify-content:space-between;color:var(--muted)}
.pmsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,17,26,.88);padding:2rem 3.2rem;border-radius:1rem;max-width:72rem;text-align:center}

.loading{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4rem;background:rgba(10,17,26,.92);z-index:10}
.spinner{width:6rem;height:6rem;border:.5rem solid rgba(160,28,42,.45);border-top-color:var(--amber);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pbar{width:34rem;max-width:70vw;height:.9rem;border-radius:.5rem;background:rgba(160,28,42,.3);overflow:hidden}
.pbar-fill{height:100%;width:0%;background:var(--amber);border-radius:.5rem;transition:width .2s ease}
html.light .pbar{background:rgba(120,70,20,.18)}
.toast{position:fixed;top:3rem;left:50%;transform:translateX(-50%);background:var(--raise);padding:1.4rem 2.8rem;border-radius:.8rem;border:.1rem solid var(--line);z-index:11}
#numjump{position:fixed;top:4rem;right:5rem;font-size:8rem;font-weight:700;color:var(--amber);background:rgba(10,17,26,.9);padding:1rem 3rem;border-radius:1rem;z-index:12;line-height:1}
/* logo + splash */
.logo img{display:block;width:100%;height:auto}
#login-logo{grid-column:1;grid-row:1 / span 10;width:34rem;filter:drop-shadow(0 1.2rem 3rem rgba(160,28,42,.3))}
#rail-logo{width:9rem;margin:-1rem auto 2rem}
/* live preview */
#preview{display:none;width:38rem;flex:none;flex-direction:column;padding-top:.6rem}
#page-browse.collapsed #cats{display:none}
#page-browse.collapsed #preview{display:flex}
.pvbox{position:relative;flex:none;width:38rem;height:21.4rem;background:#000;border-radius:.8rem;overflow:hidden;border:.1rem solid var(--line)}
#pv{width:100%;height:100%;object-fit:contain;display:block}
.pvmsg{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2.4rem;color:var(--muted);font-size:1.8rem}
.pvmsg:empty{display:none}
.pvinfo{padding:1.4rem .4rem 0}
.pvname{font-size:2.4rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvnum{font-family:'Barlow Condensed','Arial Narrow',sans-serif;color:var(--amber);margin-right:1.2rem}
.pvsub{color:var(--muted);font-size:1.7rem;margin:.4rem 0 1.2rem}
#preview{overflow:hidden}
.pvbox.live{border-color:rgba(231,185,111,.55)}
.sched{margin-top:.8rem}
.slabel{display:flex;align-items:baseline;gap:1.2rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:1.4rem;color:var(--amber);margin:1.4rem 0 .5rem}
.slabel span{font-family:'Barlow',sans-serif;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:1.6rem}
.snow{background:linear-gradient(90deg,rgba(160,28,42,.32),rgba(160,28,42,.05));border-left:.4rem solid var(--red2);border-radius:0 .6rem .6rem 0;padding:.2rem 1.4rem 1.2rem}
.snow .slabel{margin-top:.8rem}
.stt2{font-size:2.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:.5rem;background:rgba(255,255,255,.12);border-radius:.25rem;margin:.8rem 0 .2rem;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--amber))}
.sdesc{color:var(--muted);font-size:1.6rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.7rem}
.srow{display:flex;gap:1.6rem;font-size:1.9rem;padding:.55rem 0;border-bottom:.1rem solid rgba(35,65,79,.6);white-space:nowrap}
.srow .t{width:9rem;flex:none;color:var(--muted)}
.srow .stt{overflow:hidden;text-overflow:ellipsis}
.sempty{color:var(--muted);font-size:1.7rem;margin-top:1.4rem}
.osd .sbar{max-width:60rem}
h2 .sep{color:var(--muted);font-weight:500;margin:0 1.2rem}
/* movie details */
#movie{background:var(--bg);overflow:hidden}
.mback{position:absolute;top:0;right:0;width:72%;height:78%;background:center/cover no-repeat;opacity:.4}
.mback::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(10,17,26,.55) 40%,rgba(10,17,26,.15) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(10,17,26,0) 55%)}
.mwrap{position:absolute;top:0;left:0;right:0;bottom:5rem;display:grid;grid-template-columns:24rem 1fr;gap:4rem;padding:5rem 6rem 0}
.mposter{width:24rem;height:36rem;border-radius:.8rem;background:var(--panel) center/cover no-repeat;box-shadow:0 2rem 4rem rgba(0,0,0,.55),0 0 0 .15rem rgba(231,185,111,.35)}
.minfo{display:flex;flex-direction:column;min-width:0;min-height:0}
.mstar{color:var(--amber)}
.mcred{font-size:1.8rem;color:var(--muted);line-height:1.5;margin-bottom:1.2rem;flex:none}
.mcred div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcred b{color:var(--amber);font-weight:600;margin-right:1rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:1.5rem}
.mplot{font-size:1.9rem;line-height:1.45;max-width:100rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2rem;flex:none}
.mplot.muted{color:var(--muted)}
.mbtns{display:flex;gap:1.2rem;margin-bottom:.8rem;flex:none}
.mbtns .btn{padding:1rem 2.8rem}
#m-vers{flex:1;min-height:0}
.row.ver{height:6.8rem}
.row.ver .vt{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.row.ver .vtop{display:flex;align-items:center;gap:1.4rem;min-width:0}
.row.ver .vl{font-weight:600;flex:none}
.row.ver .sub{font-size:1.6rem;margin-top:.3rem}
.row.ver.more .vl{color:var(--amber);font-weight:600}
.row.ver.more{gap:2rem}
.warn{flex:none;font-size:1.4rem;color:#FFB4A8;border:.15rem solid rgba(229,72,63,.6);border-radius:.4rem;padding:.2rem .7rem}
.best{flex:none;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.4rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:.15rem solid rgba(231,185,111,.5);border-radius:.4rem;padding:.25rem .7rem}
.qb{position:absolute;top:.4rem;left:.4rem;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.3rem;font-weight:700;background:rgba(10,17,26,.85);color:var(--amber);padding:.1rem .5rem;border-radius:.3rem}
.svers{display:flex;gap:1.2rem;overflow-x:auto;overflow-y:hidden;flex:none;margin-bottom:1.2rem;scrollbar-width:none}
.svers::-webkit-scrollbar{display:none}
.svers:empty{display:none}
/* overlays */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,12,16,.8)}
.obox{min-width:min(56rem, 92vw);max-height:80vh;display:flex;flex-direction:column;background:var(--panel);border:.15rem solid rgba(231,185,111,.45);border-radius:1.2rem;padding:1.6rem 2.4rem 2.4rem;box-shadow:0 2rem 6rem rgba(0,0,0,.6)}
.obox .slabel{flex:none}
#opts-list{overflow-y:auto;flex:1 1 auto;min-height:0}
.obox .row{height:5.4rem;flex:none}
html.native,html.native body{background:transparent!important}
html.native #player{background:transparent}
html.native #video{display:none}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.card.focus .poster{transition:none}}
#ask-msg{white-space:pre-wrap}

/* the game page: tiles on the left, a live look at the channel you are on, on the right */
.gbody{flex:1;min-height:0;display:flex;gap:2.4rem}
#game #g-chans{min-width:0}
.gpv{width:54rem;flex:none;display:flex;flex-direction:column;padding-top:.4rem}
.gpv-box{position:relative;width:54rem;height:30.4rem;background:#000;border-radius:1.6rem;overflow:hidden;border:.25rem solid #8A6A45;box-shadow:inset 0 0 0 .4rem #0B121B,0 1rem 3rem rgba(0,0,0,.5)}
.gpv-box video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.gpv-msg{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2.4rem;color:var(--muted);font-size:2rem}
.gpv-msg:empty{display:none}
.gpv-info{padding:1.6rem .4rem 0}
.gpv-name{font-size:2.8rem;font-weight:600;color:#fff}
.gpv-line{font-size:1.9rem;color:#E9CBA0;margin-top:.6rem}
.gpv-now{font-size:2rem;color:var(--text);margin-top:1rem}
.gpv-now b{color:var(--amber);margin-right:.8rem}
.gbody.withpv .csec{grid-template-columns:repeat(2,1fr)}
html.phone .gpv{display:none}
.hb-pill.rep{background:transparent;border:.25rem solid #E9B96E;color:#E9B96E}

/* two soft spotlights from the top corners, meeting on the tile you have selected */
.hspot{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
#home .hwrap{z-index:1}
.hs-glow{position:absolute;top:-18%;width:48%;height:58%;transition:opacity .4s}
.hs-glow.l{left:-15%;background:radial-gradient(ellipse at 40% 40%,rgba(255,232,190,.36),rgba(255,232,190,.13) 36%,rgba(255,232,190,0) 68%)}
.hs-glow.r{right:-15%;background:radial-gradient(ellipse at 60% 40%,rgba(255,232,190,.36),rgba(255,232,190,.13) 36%,rgba(255,232,190,0) 68%)}
.hs-beam{position:absolute;top:0;left:0;width:100%;height:100%;transition:opacity .4s}
@supports (background:conic-gradient(red,blue)){
  .hs-beam.l{background:conic-gradient(from 104deg at 0% 0%,rgba(255,228,175,0) 0deg,rgba(255,228,175,.20) 9.5deg,rgba(255,228,175,0) 20deg,rgba(255,228,175,0) 360deg);-webkit-mask-image:radial-gradient(circle at 0 0,#000 0%,#000 48%,rgba(0,0,0,0) 90%);mask-image:radial-gradient(circle at 0 0,#000 0%,#000 48%,rgba(0,0,0,0) 90%)}
  .hs-beam.r{background:conic-gradient(from 233deg at 100% 0%,rgba(255,228,175,0) 0deg,rgba(255,228,175,.20) 9.5deg,rgba(255,228,175,0) 20deg,rgba(255,228,175,0) 360deg);-webkit-mask-image:radial-gradient(circle at 100% 0,#000 0%,#000 48%,rgba(0,0,0,0) 90%);mask-image:radial-gradient(circle at 100% 0,#000 0%,#000 48%,rgba(0,0,0,0) 90%)}
}
.hs-pool{position:absolute;left:50%;top:44%;width:52%;height:80%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at 50% 50%,rgba(255,228,175,.20),rgba(255,228,175,.08) 42%,rgba(255,228,175,0) 70%);transition:opacity .4s,top .4s ease,width .4s ease,height .4s ease}
#home.stripfocus .hs-glow{opacity:.3}
/* focus anywhere in the Sports Hub (tabs, the game card, the sport-selector tab, the icon row) swings
   both corner beams down to meet over that box instead of the tile row -- the same two spotlights, just
   re-aimed, rather than a separate light source. transition is on opacity/position only: a conic-gradient
   angle itself can't animate smoothly across browsers, so the re-aim is an instant swap softened by the
   glow fading up around it. */
#home.stripfocus .hs-pool{top:78%;width:70%;height:64%;opacity:.55}
@supports (background:conic-gradient(red,blue)){
  #home.stripfocus .hs-beam.l{opacity:.7;background:conic-gradient(from 133deg at 0% 0%,rgba(255,228,175,0) 0deg,rgba(255,228,175,.24) 11deg,rgba(255,228,175,0) 24deg,rgba(255,228,175,0) 360deg)}
  #home.stripfocus .hs-beam.r{opacity:.7;background:conic-gradient(from 227deg at 100% 0%,rgba(255,228,175,0) 0deg,rgba(255,228,175,.24) 11deg,rgba(255,228,175,0) 24deg,rgba(255,228,175,0) 360deg)}
}
.gmnote{font-size:1.9rem;color:#E9CBA0;margin:.2rem 0 .8rem;max-width:104rem}



.cd{color:var(--amber)}
.ft-right{display:flex;flex-direction:column;align-items:flex-end;gap:.2rem;min-width:0}
.ft-bot .cd,.ft-bot .cd-on{font-size:1.9rem;font-weight:600;white-space:nowrap}
.cd-on{color:#C98A2A}
.gmwhen .cd{font-size:inherit}
.htheme{position:absolute;left:0;top:.8rem;display:flex;gap:.2rem;padding:.4rem;border:.25rem solid #B98B55;border-radius:5rem;background:rgba(10,17,26,.55);cursor:pointer;color:#B8A383;font:inherit}
.htheme span{width:5.4rem;height:5.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center}
.htheme span svg{width:3.2rem;height:3.2rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.htheme span.on{background:linear-gradient(135deg,#F0D7A6,#C79A63);color:#2A1710}

/* a tab that has been picked up to be moved */
.chip.lift{transform:translateY(-.9rem) scale(1.04);position:relative;z-index:3;box-shadow:0 1.3rem 2.2rem rgba(0,0,0,.5),0 0 1.4rem rgba(231,185,111,.4)}

.chip[draggable="true"]{cursor:grab}
.chip.dragging{opacity:.4}
.chip.dragover{box-shadow:inset .45rem 0 0 var(--amber)}







/* narrow windows: the tabs wrap instead of running off the edge, and a long countdown wraps instead of landing on the time */
#chips{flex-wrap:wrap;height:auto;min-height:5rem;row-gap:.8rem}
.ftile{height:auto;min-height:16.5rem}
.ft-bot{flex-wrap:wrap;row-gap:.2rem}

/* the home banner: one "Sports Hub" box, a wide hero game card with the sport-icon row along its bottom.
   .hhub-head itself (position/layout) is defined up near .hhub. The Live Now/Replay/Upcoming tab row
   that used to live here is gone -- too much going on in one box per the owner, and there's no longer
   any per-mode selection to show a tab for anyway (see homeBanner()'s own comment). */
/* a touch brighter/more saturated than a straight photo crop -- closer to the owner's punchy reference
   mock (example.jpg) without needing new illustrated art: less of the box buried under the dark wash,
   plus a small saturate/brightness lift on the whole card (text already has a strong shadow, so this
   doesn't cost legibility). */
.hb-game{filter:saturate(1.12) brightness(1.06) contrast(1.03);background:linear-gradient(90deg,rgba(8,13,20,.92) 0%,rgba(8,13,20,.82) 28%,rgba(8,13,20,.52) 46%,rgba(8,13,20,.16) 64%,rgba(8,13,20,0) 84%),url(hero-banner.jpg) right center/cover no-repeat,#0a1019}
.hb-title.xlong{font-size:2.3rem}





.hbd{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;background:var(--amber);margin-right:.8rem;vertical-align:middle;animation:hbpulse 1.2s ease-in-out infinite}
@keyframes hbpulse{0%,100%{opacity:.25}50%{opacity:1}}



.ft-time.ft-played{font-size:2.8rem;color:var(--muted)}

function clean(raw, withYear, keepQual) {

  let s = orig, co = '', q = '', year = '', hdr = false, cam = false, bk = false;
  const header = /^[\s#=*~\-_.·•|]{3,}/.test(s) || /[#=*~]{3,}\s*$/.test(s) || !/[A-Za-z0-9]/.test(s);
  s = s.replace(/\p{Extended_Pictographic}|[\u2500-\u25FF\u2600-\u27BF\u2B00-\u2BFF\uFE0F]/gu, ' | ');

  for (let i = 0; i < 4; i++) {
    s = s.replace(/^[\s|:\-–—»«•·.,\/\\\[\]()]+/, '');
    const sv = s.match(/^(now\s?tv|now)\s*(?:[|:»\-–—•·\/\\\])]\s*)+/i);   /* service labels like "NOW:" */
    if (sv) { s = s.slice(sv[0].length); continue; }
    const m = s.match(/^([A-Za-z]{2,5}(?:-[A-Za-z]{2})?)(?:\s*[\])]|\s*(?=[|:»\-–—•·\/\\(])|\s*$)/);
    if (!m || m[1] !== m[1].toUpperCase()) break;
    const up = m[1].toUpperCase(), nd = up.replace('-', '');
    if (COUNTRIES.has(up) || COUNTRIES.has(nd)) { if (!co) co = CMAP[nd] || CMAP[up] || up; s = s.slice(m[0].length); continue; }
    if (up === 'VIP') { s = s.slice(m[0].length); continue; }
    break;
  }
  s = s.replace(/^([^()]{1,24})\)\s*/, '$1 ');   /* "AU (STAN 54) – …" leaves "STAN 54) – …" */
  let t = s.match(/\s*(?:[|:\-–(\[]\s*)([A-Z]{2,3})[\])]?\s*$/);
  if (!t) { t = s.match(/\s+([A-Z]{2})\s*$/); if (t && !SAFE_TRAIL.has(t[1])) t = null; }
  if (t && COUNTRIES.has(t[1]) && s.length - t[0].length > 1) { if (!co) co = CMAP[t[1]] || t[1]; s = s.slice(0, -t[0].length); }

  if (withYear) {
    if (/^\S+$/.test(s) && (s.match(/\./g) || []).length >= 2) s = s.replace(/_|(?<!\d)\.|\.(?!\d)/g, ' ');   /* Movie.2021.1080p.WEB-DL style names */
    s = s.replace(TECH_RE, '$1 ');
  }
  if (!withYear && !keepQual && /(^|[^A-Za-z])(BACKUP|BKP)([^A-Za-z]|$)/i.test(s)) { bk = true; s = s.replace(/[\s(\[|:-]*\b(BACKUP|BKP)\b[\])]?/ig, ' '); }
  if (!keepQual) s = s.replace(QUAL_RE, (m0, pre, tag) => {
    const u = tag.toUpperCase().replace(/\s/g, '');
    const r = QRANK[u];
    if (r && (!q || r > QRANK[q])) q = QLABEL[u] || u;
    if (/^(HDR|HDR10\+?|DV|DOLBYVISION)$/.test(u)) hdr = true;
    if (/^(CAM|HDCAM|CAMRIP)$/.test(u)) cam = true;
    return pre + ' ';
  });
  if (withYear) {
    const y = s.match(/\s*(?:[-–|]\s*|[(\[])((?:19|20)\d{2})[\])]?\s*$/);
    if (y && s.length - y[0].length > 1) { year = y[1]; s = s.slice(0, -y[0].length); }
  }
  s = s.replace(/\(\s*\)|\[\s*\]/g, ' ')
       .replace(/\s*[|»«•·]+\s*/g, ' – ')
       .replace(/(\s*–\s*){2,}/g, ' – ')
       .replace(/^[\s\-–—:|.,\/]+|[\s\-–—:|.,\/]+$/g, '')
       .replace(/\s{2,}/g, ' ');
  const letters = s.replace(/[^A-Za-z]/g, '');
  if (letters.length >= 4 && letters.replace(/[^A-Z]/g, '').length / letters.length > 0.85) s = s.split(' ').map(titleWord).join(' ');
  return {name: s || orig, co, q, year, header, hdr, cam, bk};
}

const NORM_CACHE = new Map();
const norm = s => {
  const k = String(s ?? '');
  let v = NORM_CACHE.get(k);
  if (v === undefined) {
    v = k.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/'/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
    if (NORM_CACHE.size > 120000) NORM_CACHE.clear();
    NORM_CACHE.set(k, v);

};

    r = g.next();

function getJSON(url) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 90000;
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) {
        try { res(JSON.parse(x.responseText)); } catch (e) { rej(new Error('The server sent a reply this app can\'t read.')); }
      } else rej(new Error('The server replied with error ' + x.status + '.'));
    };
    x.onerror = () => rej(new Error('Can\'t reach the server. Check the address and the TV\'s internet connection.'));
    x.ontimeout = () => rej(new Error('The server took too long to respond.'));
    x.send();
  });
}
function api(action, extra) {
  let u = cfg.server + '/player_api.php?username=' + encodeURIComponent(cfg.user) + '&password=' + encodeURIComponent(cfg.pass);
  if (action) u += '&action=' + action;
  if (extra) u += extra;
  return getJSON(u);
}

const idb = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('streamplayer', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) return res(undefined);
      try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }
      catch (e) { res(undefined); }
    });
  },
  set(k, v) {
    return new Promise(res => {
      if (!this.db) return res(false);
      try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }
      catch (e) { res(false); }
    });
  }
};
const cacheKey = () => cfg.type === 'm3u' ? 'data:m3u|' + cfg.url : 'data:' + cfg.server + '|' + cfg.user;

function procCats(a) {

}
function* procItemsG(a, t) {
  const out = []; let n = 0;
  for (const x of arr(a)) {
    if ((++n & 63) === 0) yield;
    const c = clean(x.name, t !== 'live');
    if (c.header) continue;
    let it;
    if (t === 'live') {
      it = {t, id: String(x.stream_id), num: x.num ?? '', icon: x.stream_icon || ''};
    } else if (t === 'vod') {
      it = {t, id: String(x.stream_id), icon: x.stream_icon || '', ext: x.container_extension || 'mp4',
        added: Number(x.added) || 0, rating: parseFloat(x.rating) || 0, year: c.year || String(x.year || '').slice(0, 4)};
    } else {
      it = {t, id: String(x.series_id), icon: x.cover || '', added: Number(x.last_modified) || 0,
        rating: parseFloat(x.rating) || 0, year: c.year || String(x.releaseDate || x.release_date || x.year || '').slice(0, 4)};
    }
    it.raw = String(x.name ?? ''); it.name = c.name; it.co = c.co; it.ql = c.q; it.cat = String(x.category_id);
    if (c.hdr) it.hdr = 1;

    if (x.epg_channel_id) it.epg = String(x.epg_channel_id);
    if (t === 'live' && Number(x.tv_archive) === 1) it.arch = Number(x.tv_archive_duration) || 1;
    if (x.eps) it.eps = x.eps;

}
const procItems = (a, t) => runSync(procItemsG(a, t));
/* A search-only index: every movie/series stream, but reduced to just {id, name, cat} -- none of
   procItemsG's icon/ext/rating/year fields, and no title-grouping (no .vers merging multiple quality
   copies into one entry). That's the whole point: the full, grouped catalog is what OOM-crashed this
   device (confirmed on device: 50,995 grouped movie titles plus 49,545+ raw series items together,
   while Search was open). A lean {id,name,cat} record costs a small fraction of a full grouped title,
   so holding every stream in the account at once stays well under what crashed before. Search matches
   against this; opening a result hydrates it on demand via ensureCategoryItems (see openItem), the same
   cheap per-category fetch Movies/Series browsing already uses. */
function* procSearchIndexG(a, t) {
  const out = []; let n = 0;
  for (const x of arr(a)) {
    if ((++n & 511) === 0) yield;
    const c = clean(x.name, t !== 'live');
    if (c.header) continue;
    const it = {t, lite: 1, id: String(t === 'vod' ? x.stream_id : x.series_id), name: c.name, cat: String(x.category_id)};
    indexItem(it);
    out.push(it);
  }
  return out;
}

/* Works out each channel's country and genre, and pre-sorts every group A–Z.
   The category name decides first; the channel's own name is only used when the category doesn't say. */
function* classifyLiveG() {
  const L = D_().live, cc = {}, cg = {};
  L.cats.forEach(c => { const n = norm(c.raw); cc[c.id] = c.co || countryFromText(n); cg[c.id] = genreOf(' ' + n + ' '); });
  L.sorted = azSort(L.items);
  const geo = new Map();
  let n = 0; const total = L.sorted.length || 1;
  for (const it of L.sorted) {
    it.cc = it.co || cc[it.cat] || countryFromText(norm(it.raw)) || 'ZZ';
    if (!CNAME[it.cc]) CNAME[it.cc] = it.cc;
    it.g = cg[it.cat] || genreOf(it.s) || 'General';
    let c = geo.get(it.cc);
    if (!c) { c = {cc: it.cc, name: CNAME[it.cc], items: [], genres: new Map()}; c.items.az = true; geo.set(it.cc, c); }
    c.items.push(it);
    let g = c.genres.get(it.g);
    if (!g) { g = []; g.az = true; c.genres.set(it.g, g); }
    g.push(it);
    if ((++n & 127) === 0) yield n / total;
  }
  const list = [...geo.values()];
  list.forEach(c => { c.glist = [...c.genres.entries()].sort((a, b) => a[0] === 'General' ? 1 : b[0] === 'General' ? -1 : a[0].localeCompare(b[0])); });
  list.sort((a, b) => a.cc === 'ZZ' ? 1 : b.cc === 'ZZ' ? -1 : a.name.localeCompare(b.name));

/* Prepares the lists in slices (with a short message if asked) and swaps them in only when everything is ready. */
/* TEMPORARY diagnostic instrumentation: three rounds of fixes aimed at reducing memory pressure
   (the logo database) did not move the needle on the owner's actual crash -- the V8 heap OOM recurred
   at essentially the same ~223MB, ~138s mark on build 11 as it did before any of those fixes. Rather
   than guess at the next hypothesis, this reports the real size of each major retained structure (and
   performance.memory, where the WebView supports it -- this one does, Chromium 138) straight to logcat
   at the moments that matter, plus every 20s so the growth curve up to a crash is visible, not just
   snapshots. Remove once the real culprit is identified and fixed; this is not meant to ship long-term. */
function memLog(label) {
  try {
    const m = performance.memory;
    const parts = [
      m ? 'heapUsedMB=' + (m.usedJSHeapSize / 1048576).toFixed(1) : 'heap=n/a',
      m ? 'heapTotalMB=' + (m.totalJSHeapSize / 1048576).toFixed(1) : '',
      'liveCh=' + (DATA && DATA.live ? DATA.live.items.length : '-'),
      'liveRaw=' + (DATA && DATA.live && DATA.live.vers ? DATA.live.vers.length : '-'),
      'vodItems=' + (DATA && DATA.vod ? DATA.vod.items.length : '-'),
      'seriesItems=' + (DATA && DATA.series ? DATA.series.items.length : '-'),
      'guideItems=' + (GUIDE ? GUIDE.items.length : '-'),
      'guideChans=' + (GUIDE && GUIDE.chans ? Object.keys(GUIDE.chans).length : '-'),
      'events=' + (EVENTS ? EVENTS.length : '-'),
      'logoMap=' + (LOGOMAP ? 'u' + LOGOMAP.u.length + '/k' + Object.keys(LOGOMAP.k).length : '-')
    ].filter(Boolean).join(' ');
    console.error('MEMPROBE [' + label + '] ' + parts);
  } catch (e) { console.error('MEMPROBE [' + label + '] error: ' + e.message); }
}

async function applyData(d, show) {
  /* Live channel processing is the one phase with real, known-length work (the account's whole live
     list, 49,121 channels in the case this was reported against) and now reports real progress through
     it instead of leaving the owner looking at a frozen spinner with no idea whether it's still working.
     vod/series are deferred (see below) so they have nothing meaningful to show here. Weights are a
     rough split across the four live sub-phases (grouping is the dominant one), not a precise measure --
     good enough for a progress bar, not claimed as exact. */
  const say = (m, pct) => { if (show) loading(true, m, pct); };
  CUR = d;
  try {
    let all = [];
    for (const t of ['live', 'vod', 'series']) {
      const x = d[t];
      const msg = t === 'live' ? 'Preparing channels…' : t === 'vod' ? 'Preparing movies…' : 'Preparing series…';
      say(msg, t === 'live' ? 0 : undefined);
      if (t === 'live') {
        await runSliced(prepChannelsG(), p => say(msg, p * 55)); x.grouped = true;
        await runSliced(splitAdultG(t), p => say(msg, 55 + p * 15));
        x.byId = new Map(x.items.map(i => [i.id, i]));
        x.catName = new Map(x.cats.map(c => [c.id, c.name]));
        all = all.concat(x.items);
      } else {
        /* vod/series: fetching and grouping every copy of every title into one entry is the single
           biggest cost in the app (confirmed: it OOM-crashes a Fire TV Stick on a 200k+ item
           provider, and is slow even on hardware with enough RAM to survive it). Skip it here and do
           it later, once, the first time the user actually opens Movies/Series/Search/Favourites
           (ensureTitlesGrouped) — most sessions that only watch live TV never pay that cost at all.
           This used to apply only to Xtream accounts, on the assumption that M3U accounts -- whose
           whole catalog arrives pre-parsed in one playlist file, with no separate per-category fetch
           to defer -- had "nothing to defer". That assumption was wrong: the grouping step itself (and
           the adult split / id lookup map / global Search concat riding on it) is exactly as deferrable
           for M3U as for Xtream. Skipping that deferral for M3U was why a large M3U playlist (182,569
           raw vod + 49,476 series items, seen on the device this was diagnosed against) was fully
           grouped and held in memory on every single boot, before the owner had even opened Movies --
           found only once diagnostics showed vod/series fully populated immediately after applyData(),
           before Home had even rendered, with Movies never having been opened that session. */
        x.fetched = isM3u(); x.grouped = false;
      }
    }
    const liveMsg = 'Preparing channels…';
    await runSliced(classifyLiveG(), p => say(liveMsg, 70 + p * 15));
    await runSliced(applyLogosG(), p => say(liveMsg, 85 + p * 15));
    DATA = d; ALL = all;
    for (const t of ['live', 'vod', 'series']) B[t].cats = [];
    EVENTS = null;
    V++;
    Q.last = null;
    memLog('applyData done');
  } finally { CUR = null; }
}

let refreshing = false;
async function refreshAll(fg) {
  if (refreshing) return;
  refreshing = true;
  const step = m => { if (fg) loading(true, m); };
  try {
    if (isM3u()) {
      step('Downloading playlist…');
      const text = await getText(cfg.url);
      step('Tidying up names…');
      await sleep(30);
      const d = parseM3u(text);
      await idb.set(cacheKey(), d);
      await applyData(d, fg);
      if (S.screen === 'main') { showPage(S.page); if (isSearchPage(S.page) && Q.text) runSearch(); }
      if (!fg) toast('Lists updated');
      return;
    }
    step('Downloading channels…');
    const [lc, ls] = await Promise.all([api('get_live_categories'), api('get_live_streams')]);
    /* Movies/series categories only here — the (often huge) item lists are fetched lazily,
       per type, by ensureTitlesGrouped the first time they're actually needed. */
    step('Downloading movie and series categories…');
    const [vc, sc] = await Promise.all([api('get_vod_categories'), api('get_series_categories')]).catch(() => [[], []]);
    step('Tidying up names…');
    await sleep(30);
    const d = {
      updated: Date.now(),
      live: {cats: procCats(lc), items: await runSliced(procItemsG(ls, 'live'))},
      vod: {cats: procCats(vc), items: [], fetched: false},
      series: {cats: procCats(sc), items: [], fetched: false}
    };
    await idb.set(cacheKey(), d);
    await applyData(d, fg);
    if (S.screen === 'main') { showPage(S.page); if (isSearchPage(S.page) && Q.text) runSearch(); }
    if (!fg) toast('Lists updated');
  } finally {
    refreshing = false;
    if (fg) loading(false);
  }
}

    x.timeout = 120000;
    x.onload = () => (x.status >= 200 && x.status < 300) ? res(x.responseText) : rej(new Error('The playlist link replied with error ' + x.status + '.'));
    x.onerror = () => rej(new Error('Can\'t reach the playlist link. Check it and the TV\'s internet connection.'));

        const key = show.toLowerCase() + '|' + cur.group;

    vod: {cats: procCats(catList('vod')), items: procItems(vod, 'vod')},

/* Draws only the rows on screen and reuses them when just the highlight moves. */
class VView {
  constructor(el, o) { this.el = el; this.rowH = o.rowH; this.cols = o.cols || (() => 1); this.rf = o.render; this.top = 0; this.sig = ''; this.vis = 1; this.nc = 1; }
  update(list, sel, active, key) {
    const nc = this.cols(), vis = Math.max(1, Math.floor(this.el.clientHeight / (remPx() * this.rowH)));
    const rows = Math.ceil(list.length / nc), sr = Math.floor(Math.max(0, sel) / nc);
    let top = this.top;
    if (sr < top) top = sr;
    if (sr >= top + vis) top = sr - vis + 1;
    top = Math.max(0, Math.min(top, rows - vis));
    this.top = top; this.vis = vis; this.nc = nc;
    const sig = key + '|' + top + '|' + nc + '|' + vis + '|' + list.length;
    if (sig !== this.sig) {
      this.sig = sig;
      const a = top * nc, b = Math.min(list.length, (top + vis + 1) * nc), parts = [];
      for (let i = a; i < b; i++) parts.push(this.rf(list[i], i));
      this.el.innerHTML = parts.join('');
    }
    this.el.querySelectorAll('.focus,.current').forEach(e => e.classList.remove('focus', 'current'));
    const c = this.el.querySelector('[data-i="' + sel + '"]');
    if (c) c.classList.add(active ? 'focus' : 'current');
  }
  page() { return Math.max(1, this.vis - 1) * this.nc; }
  reset() { this.top = 0; this.sig = ''; }
}

function strictScore(it, toks, qs, whole) {
  let sc = 0;
  for (const t of toks) {
    const i = it.s.indexOf(' ' + t);
    if (i >= 0) sc += i === 0 ? 3 : 2;
    else if (t.length >= 3 && it.s.indexOf(t) > 0) sc += 1;
    else { sc = 0; break; }
  }
  if (!sc && qs.length >= 4 && it.q.indexOf(qs) >= 0) sc = 1;
  if (sc) {
    if (it.s.startsWith(' ' + whole)) sc += 3;
    if (it.s.startsWith(' ' + whole + ' ') && it.q === qs) sc += 5;
  }

}

      if (cur[j] < rowMin) rowMin = cur[j];
    }
    if (rowMin > k) return k + 1;
    prev = cur;
  }
  let best = k + 1;
  for (let j = Math.max(0, n - k); j <= m; j++) if (prev[j] < best) best = prev[j];

}

    const k = t.length >= 7 ? 2 : 1;
    let ok = false;
    for (const w of words) { if (Math.abs(w.length - t.length) > 6 && w.length < t.length) continue; if (prefixLev(t, w, k) <= k) { ok = true; break; } }
    if (!ok) return 0;
    sc += 0.5;
  }
  return sc;
}

function runSearch() {

  const nq = norm(Q.text);

  if (!nq) { Q.all = []; Q.last = null; Q.toks = []; publish([]); return; }

}

/* Self-healing crash-loop guard. The scenario this exists for: a device too constrained to survive

   doesn't depend on reaching a UI the crash itself blocks. Every boot records a timestamp and a
   "stable" flag (set true once this boot has stayed up long enough to be past where the crash this
   was built for was observed, ~136s). If a NEW boot starts and the previous one never reached stable,
   that's real evidence of a crash loop, and the heavy optional work is skipped automatically for this
   run -- the saved setting itself is untouched, so normal behaviour resumes on its own once boots
   stop crash-looping. Runs once, before anything else, so it covers every path into enterMain(). */
const CRASHGUARD_KEY = 'sp_crashguard';

/* A single quick relaunch -- closed and reopened within 5 minutes, before the 150s "stable" mark --
   is completely normal: it's what happens every time someone force-closes the app to test something,
   or Fire TV backgrounds it and they tap straight back in. Treating that alone as "a crash" was wrong;
   it fired this warning on a healthy device that never crashed, just because it had been closed and
   reopened quickly. A real crash loop looks like it happening repeatedly in a row, so this now needs a
   streak of 2+ before it acts, not a single quick relaunch. */
