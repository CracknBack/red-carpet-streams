name: Build Firestick app

# Manual only (Actions tab > Run workflow, or gh workflow run) -- not on every push, so pushing code changes does not burn a build until you ask for one.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug has the PLAYBACK_AUDIT.md Phase B harness; release never does)'
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folders
        run: |
          # Works whether the project sits at the top of the repository or inside one extra folder.
          f=$(find . -path '*/tv-app/index.html' -not -path '*/assets/*' | head -n 1)
          if [ -z "$f" ]; then echo "Top level of the repository:"; ls -la; echo "::error::Couldn't find the tv-app folder. It may not have been uploaded."; exit 1; fi
          root=$(cd "$(dirname "$f")/.." && pwd)
          if [ ! -f "$root/firestick/app/build.gradle" ]; then echo "::error::Found tv-app in $root but not the firestick folder next to it. It may not have been uploaded."; exit 1; fi
          echo "Project found in $root"
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Read the app version
        run: echo "VER=$(jq -r .version "$ROOT/tv-app/appinfo.json")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the TV app inside the Android app
        run: |
          mkdir -p "$ROOT/firestick/app/src/main/assets/www"
          cp -r "$ROOT/tv-app/." "$ROOT/firestick/app/src/main/assets/www/"

      - name: Write the release keystore (never committed -- see build.gradle's signingConfigs comment)
        if: inputs.build_type != 'debug'
        run: echo "${{ secrets.RCS_KEYSTORE_B64 }}" | base64 -d > "$ROOT/firestick/app/rcs-release.p12"

      - name: Build
        env:
          RCS_KEYSTORE_PASSWORD: ${{ secrets.RCS_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            gradle -p "$ROOT/firestick" assembleDebug --no-daemon
            echo "APK_SRC=$ROOT/firestick/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "SUFFIX=-debug" >> "$GITHUB_ENV"
          else
            gradle -p "$ROOT/firestick" assembleRelease --no-daemon
            echo "APK_SRC=$ROOT/firestick/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Name the file
        run: cp "$APK_SRC" "RedCarpetStreams-${{ env.VER }}-build${{ github.run_number }}${{ env.SUFFIX }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RedCarpetStreams-${{ env.VER }}-build${{ github.run_number }}${{ env.SUFFIX }}
          path: RedCarpetStreams-${{ env.VER }}-build${{ github.run_number }}${{ env.SUFFIX }}.apk

      - name: Publish as a release (easy to download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firestick-${{ github.run_number }}
          name: Red Carpet Streams ${{ env.VER }} (build ${{ github.run_number }}${{ env.SUFFIX }})
          files: RedCarpetStreams-${{ env.VER }}-build${{ github.run_number }}${{ env.SUFFIX }}.apk
