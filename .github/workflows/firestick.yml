name: Build Firestick app

# Manual only (Actions tab > Run workflow, or gh workflow run) -- not on every push, so pushing code changes does not burn a build until you ask for one.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Which applicationId(s) to build -- firestick keeps the original com.tyre.redcarpetstreams id/keystore continuity, player is the new com.redcarpetplayer.app commercial release'
        required: false
        default: player
        type: choice
        options:
          - player
          - firestick
          - both
      build_type:
        description: 'Build type (debug has the PLAYBACK_AUDIT.md Phase B harness; release never does)'
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folders
        run: |
          # Works whether the project sits at the top of the repository or inside one extra folder.
          f=$(find . -path '*/tv-app/index.html' -not -path '*/assets/*' | head -n 1)
          if [ -z "$f" ]; then echo "Top level of the repository:"; ls -la; echo "::error::Couldn't find the tv-app folder. It may not have been uploaded."; exit 1; fi
          root=$(cd "$(dirname "$f")/.." && pwd)
          if [ ! -f "$root/firestick/app/build.gradle" ]; then echo "::error::Found tv-app in $root but not the firestick folder next to it. It may not have been uploaded."; exit 1; fi
          echo "Project found in $root"
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Read the app version
        run: echo "VER=$(jq -r .version "$ROOT/tv-app/appinfo.json")" >> "$GITHUB_ENV"

      - name: Read the build number
        # The one tracked counter build.gradle itself also reads (see its own comment) -- CI and a
        # local build share this file so "build N" always means the same versionCode either way.
        run: echo "BUILD_NUM=$(cat "$ROOT/firestick/BUILD_NUMBER")" >> "$GITHUB_ENV"

      - name: Work out which flavors to build
        run: |
          case "${{ inputs.flavor }}" in
            both) echo "FLAVORS=firestick player" >> "$GITHUB_ENV" ;;
            firestick) echo "FLAVORS=firestick" >> "$GITHUB_ENV" ;;
            *) echo "FLAVORS=player" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the TV app inside the Android app
        run: |
          mkdir -p "$ROOT/firestick/app/src/main/assets/www"
          cp -r "$ROOT/tv-app/." "$ROOT/firestick/app/src/main/assets/www/"

      - name: Write the release keystore (never committed -- see build.gradle's signingConfigs comment)
        if: inputs.build_type != 'debug'
        run: echo "${{ secrets.RCS_KEYSTORE_B64 }}" | base64 -d > "$ROOT/firestick/app/rcs-release.p12"

      - name: Build and name each requested flavor
        env:
          RCS_KEYSTORE_PASSWORD: ${{ secrets.RCS_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          BT="${{ inputs.build_type }}"
          SUFFIX=""; [ "$BT" = "debug" ] && SUFFIX="-debug"
          TC="$(tr '[:lower:]' '[:upper:]' <<< ${BT:0:1})${BT:1}"   # release -> Release, debug -> Debug
          for F in $FLAVORS; do
            FC="$(tr '[:lower:]' '[:upper:]' <<< ${F:0:1})${F:1}"   # firestick -> Firestick, player -> Player
            gradle -p "$ROOT/firestick" "assemble${FC}${TC}" --no-daemon
            SRC="$ROOT/firestick/app/build/outputs/apk/$F/$BT/app-$F-$BT.apk"
            if [ "$F" = "player" ]; then
              OUT="RedCarpetPlayer-v${VER}-build${BUILD_NUM}${SUFFIX}.apk"
            else
              OUT="RedCarpetStreams-${VER}-build${BUILD_NUM}${SUFFIX}.apk"
            fi
            cp "$SRC" "$GITHUB_WORKSPACE/out/$OUT"
            echo "Built $OUT"
            # Fixed filename, release builds only -- lets the aftv.news Downloader code point at
            # releases/latest/download/RedCarpetPlayer-latest.apk once and never need re-registering.
            if [ "$F" = "player" ] && [ "$BT" != "debug" ]; then
              cp "$SRC" "$GITHUB_WORKSPACE/out/RedCarpetPlayer-latest.apk"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: redcarpet-apks-build${{ env.BUILD_NUM }}
          path: out/*.apk

      - name: Publish as a release (easy to download on your phone, or to generate a Downloader code from)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firestick-${{ env.BUILD_NUM }}
          name: Red Carpet ${{ env.VER }} (build ${{ env.BUILD_NUM }})
          files: out/*.apk

      - name: Advance the build number for next time
        # Only for a real release build -- a debug test build shouldn't burn the next public number.
        if: inputs.build_type != 'debug'
        run: |
          cd "$ROOT"
          echo "$(( BUILD_NUM + 1 ))" > firestick/BUILD_NUMBER
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firestick/BUILD_NUMBER
          git commit -m "Advance build number to $(( BUILD_NUM + 1 )) after build $BUILD_NUM"
          git push
